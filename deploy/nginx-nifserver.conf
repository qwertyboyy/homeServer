# /etc/nginx/sites-available/nifserver-panel  (optional)
# Recommended: one LAN entry point (port 8088) that also routes /api directly
# to the backend, so it sees real client IPs for login rate limiting.
# Check the port is free first: `ss -ltnp | grep ':8088'`.
# Apache already owns :80/:443 for WebDAV - do NOT reuse those ports.

# Keep https from cloudflared so the API marks the session cookie Secure.
map $http_x_forwarded_proto $nif_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8088;            # LAN entry point; also the target for cloudflared
    server_name panel.nifserver.cloud nifserver.local _;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Hosting Manager ZIP upload: the only route with a large body. Keep the
    # limit in sync with HOSTING_MAX_UPLOAD_MB (+ a little overhead).
    location ~ ^/api/v1/hosting/apps/[a-z0-9-]+/deploy/upload$ {
        client_max_body_size 55m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nif_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/v1/hosting/ {
        client_max_body_size 64k;   # env editor bodies exceed the 16k default below
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nif_forwarded_proto;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nif_forwarded_proto;
        proxy_read_timeout 15s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nif_forwarded_proto;
    }
}
