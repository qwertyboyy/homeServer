# Loopback only. Every phpMyAdmin request checks the current dashboard session.
map $http_x_forwarded_proto $nif_pma_https {
    default off;
    https on;
}
server {
    listen 127.0.0.1:8091;
    server_name _;
    root /usr/share;
    index index.php;
    client_max_body_size 32m;
    auth_request /_nif_pma_auth;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /_nif_pma_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:3001/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /phpmyadmin/nifhost-signon.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/local/lib/nifhost/phpmyadmin-signon.php;
        fastcgi_param NIFHOST_PMA 1;
        fastcgi_param HTTPS $nif_pma_https;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/phpmyadmin/(setup|libraries|templates|vendor|examples|test|doc|sql)(/|$) { deny all; }
    location ~ /\. { deny all; }
    location ~ ^/phpmyadmin/.*\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param NIFHOST_PMA 1;
        fastcgi_param HTTPS $nif_pma_https;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }
    location /phpmyadmin/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
