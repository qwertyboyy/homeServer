# Dedicated loopback listener: Cloudflare Tunnel -> http://127.0.0.1:8088
# WebDAV on 8080 and existing default vhost are configured separately.
Listen 127.0.0.1:8088
<VirtualHost 127.0.0.1:8088>
    ServerName localhost
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    AllowEncodedSlashes Off
    LimitRequestBody 62914560

    # Run only as www-data. Backend sessions are checked on every PMA request.
    RewriteEngine On
    RewriteMap nif_pma_auth "prg:/usr/local/lib/nifhost/apache-session-check.py" www-data:www-data
    RewriteCond %{HTTP:Cookie} "!(^|;[[:space:]]*)nif_session=[A-Za-z0-9_-]{43}(;|$)"
    RewriteRule "^/phpmyadmin(?:/|$)" "-" [R=401,L]
    RewriteCond %{HTTP:Cookie} "(^|;[[:space:]]*)nif_session=([A-Za-z0-9_-]{43})(;|$)"
    RewriteCond "${nif_pma_auth:%2|DENY}" "!=OK"
    RewriteRule "^/phpmyadmin(?:/|$)" "-" [R=401,L]

    # Exceptions precede the catch-all proxy. No global phpMyAdmin Alias.
    ProxyPass /phpmyadmin !
    Alias /phpmyadmin/nifhost-signon.php /usr/local/lib/nifhost/phpmyadmin-signon.php
    Alias /phpmyadmin /usr/share/phpmyadmin
    ProxyPass /api/ http://127.0.0.1:3001/api/ connectiontimeout=5 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:3000/

    <Directory /usr/share/phpmyadmin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>
    <Directory /usr/local/lib/nifhost>
        AllowOverride None
        Options -Indexes
        Require all denied
        <Files phpmyadmin-signon.php>
            Require all granted
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </Files>
    </Directory>
    <DirectoryMatch "^/usr/share/phpmyadmin/(setup|libraries|templates|vendor|examples|test|doc|sql)(/|$)">
        Require all denied
    </DirectoryMatch>
    <LocationMatch "^/phpmyadmin(?:/|$)">
        SetEnv NIFHOST_PMA 1
        SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
        LimitRequestBody 33554432
        Header always set Cache-Control "no-store"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
    </LocationMatch>
    ErrorLog ${APACHE_LOG_DIR}/nifserver-panel-error.log
    CustomLog ${APACHE_LOG_DIR}/nifserver-panel-access.log combined
</VirtualHost>
